<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tohum Bankası</title>
<meta name="description" content="Okulumuzun tohum bankası: çeşitler, adetler ve ekim bilgileri.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f0e4;--card:#fffdf7;--ink:#2a2a22;--mut:#6b6a5c;--g:#2f5d3a;--g2:#e3efdc;--t:#c4572b;--line:#e2d9c4;--ok:#2f7d46;--warn:#b86e00;--bad:#b3342b;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a14;--card:#20241c;--ink:#efeadb;--mut:#a6a590;--g:#8fc79a;--g2:#26352a;--t:#ef8a5b;--line:#363b2f;--ok:#7bd196;--warn:#e9a64a;--bad:#f08379}}
*{box-sizing:inherit}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.55 Nunito,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
.hero{background:var(--g);color:#f6f0e4;padding:44px 0 36px}
@media(prefers-color-scheme:dark){.hero{background:#24402b}}
.eyebrow{margin:0;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;font-weight:700;opacity:.8}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(2.1rem,6vw,3.6rem);line-height:1.05;margin:.2em 0 .3em}
.hero p.lead{max-width:60ch;margin:0;font-size:1.08rem;opacity:.95}
.stats{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap}.stats b{display:block;font:800 2rem/1 Fraunces,Georgia,serif}.stats span{font-size:.85rem;opacity:.85}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:22px 0 14px}
#q{flex:1;min-width:220px;font:inherit;padding:12px 16px;border-radius:99px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
#q:focus-visible,.chip:focus-visible,.card:focus-visible{outline:3px solid var(--t);outline-offset:2px}
#chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-weight:700;font-size:.92rem;padding:7px 14px;border-radius:99px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:#fff}
@media(prefers-color-scheme:dark){.chip[aria-pressed="true"]{color:#12200f}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;margin:6px 0 30px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--g)}
.ph{aspect-ratio:4/3;background:var(--g2);display:grid;place-items:center;font-size:3.4rem;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb h3{margin:0;font:800 1.2rem/1.2 Fraunces,Georgia,serif}.sci{font-style:italic;color:var(--mut);font-size:.88rem;margin:0}
.cb p.d{margin:4px 0 0;font-size:.94rem;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:8px}
.badge{font-weight:800;font-size:.8rem;padding:3px 10px;border-radius:99px;border:2px solid currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.qty{font-weight:800}
.note{background:var(--g2);border-radius:18px;padding:18px 20px;margin:10px 0 40px}.note h2{font:800 1.3rem Fraunces,Georgia,serif;margin:0 0 6px}
.sec{margin:0 auto 36px}.sec h2{font:800 1.5rem Fraunces,Georgia,serif;margin:0 0 4px}.sec>p{margin:0 0 14px;color:var(--mut)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.dc{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;color:inherit;text-decoration:none}
a.dc:hover{border-color:var(--g)}a.dc:focus-visible{outline:3px solid var(--t);outline-offset:2px}
.lg{width:58px;height:58px;border-radius:14px;background:var(--g2);display:grid;place-items:center;font:800 1.5rem Fraunces,Georgia,serif;color:var(--g);flex:none;overflow:hidden}.lg img{width:100%;height:100%;object-fit:contain;background:#fff}
.dc b{display:block;line-height:1.2}.dc .tur{display:inline-block;font-size:.78rem;font-weight:700;color:var(--t);margin-top:2px}.dc p{margin:2px 0 0;font-size:.88rem;color:var(--mut)}
.nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:6px 18px}
.nav a{color:var(--ink);text-decoration:none;font-weight:700;font-size:.92rem;padding:6px 14px;border-radius:99px;white-space:nowrap}.nav a:hover{background:var(--g2)}
section,main{scroll-margin-top:60px}
.news{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.nw{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px}.nw h3{font:800 1.15rem/1.2 Fraunces,Georgia,serif;margin:6px 0 4px}.nw p{margin:0;white-space:pre-line;color:var(--mut)}.nw time{font-size:.82rem;color:var(--mut);margin-left:6px}
.nw .tur{display:inline-block;font-size:.78rem;font-weight:700;padding:1px 10px;border-radius:99px;background:var(--g2);color:var(--g)}.nw .tur.ev{background:var(--t);color:#fff}
.abt{white-space:pre-line;max-width:70ch;margin:0}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}.tm{text-align:center}.tm b{display:block}.tm span{color:var(--mut);font-size:.88rem}
.av{width:96px;height:96px;border-radius:50%;background:var(--g2);margin:0 auto 8px;display:grid;place-items:center;font:800 2rem Fraunces,Georgia,serif;color:var(--g);position:relative;overflow:hidden}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.gi{padding:0;border:0;border-radius:12px;overflow:hidden;cursor:pointer;aspect-ratio:4/3;background:var(--g2)}.gi img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}.gi:hover img{transform:scale(1.05)}.gi:focus-visible{outline:3px solid var(--t);outline-offset:2px}
.faq details{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 16px;margin:8px 0}.faq summary{font-weight:800;cursor:pointer}.faq p{margin:8px 0 2px;white-space:pre-line;color:var(--mut)}
#social a{color:inherit;font-weight:700}
footer{color:var(--mut);font-size:.85rem;text-align:center;padding:0 18px 28px}
dialog{border:0;border-radius:20px;padding:0;max-width:640px;width:calc(100% - 28px);background:var(--card);color:var(--ink);max-height:92dvh}
dialog::backdrop{background:rgba(10,14,8,.6)}
.dh{position:relative}.dh .ph{aspect-ratio:16/10}
.x{position:absolute;top:10px;right:10px;font:inherit;font-weight:800;border:0;border-radius:99px;width:40px;height:40px;background:var(--card);color:var(--ink);cursor:pointer;font-size:1.2rem}
.db{padding:16px 20px 22px}.db h2{font:800 1.7rem/1.1 Fraunces,Georgia,serif;margin:0}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:14px 0 0}dt{color:var(--mut);font-weight:700}dd{margin:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<header class="hero"><div class="wrap"><img id="logo" hidden alt="Okul logosu" style="height:64px;margin-bottom:10px;background:#fff;border-radius:12px;padding:4px"><p class="eyebrow" id="okul"></p><h1 id="baslik">Tohum Bankası</h1><p class="lead" id="aciklama"></p><div class="stats" id="stats"></div></div></header>
<nav class="nav" id="nav" hidden aria-label="Bölümler"></nav>
<main class="wrap" id="tohumlar">
 <div class="tools"><input id="q" type="search" placeholder="Tohum ara (ad, kategori, açıklama)…" aria-label="Tohum ara"><div id="chips" role="group" aria-label="Kategori filtresi"></div></div>
 <div class="grid" id="grid" aria-live="polite"></div>
 <p id="empty" hidden style="text-align:center;color:var(--mut)">Aramana uygun tohum bulunamadı.</p>
 <section class="note" id="iletisim" hidden><h2>Tohum almak ya da bağışlamak için</h2><p id="iletisimMetin" style="margin:0"></p></section>
</main>
<section class="wrap sec" id="duyuru" hidden></section><section class="wrap sec" id="hakkimizda" hidden></section><section class="wrap sec" id="ekip" hidden></section><section class="wrap sec" id="galeri" hidden></section><section class="wrap sec" id="sss" hidden></section>
<section class="wrap sec" id="destek" hidden><h2>Destekçilerimiz 🤝</h2><p>Bu projeye emek ve destek verenlere teşekkür ederiz.</p><div class="dgrid" id="dgrid"></div></section>
<footer><p id="social"></p><p id="foot"></p></footer>
<dialog id="dlg" aria-label="Tohum ayrıntısı"><div id="dc"></div></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EMO={"Sebze":"🍅","Meyve":"🍓","Çiçek":"🌻","Tahıl":"🌾","Baharat ve Şifalı":"🌿","Ağaç":"🌳"},emo=k=>EMO[k]||"🌱";
let D={site:{},tohumlar:[]},cat="Tümü",AZ=10;
const status=t=>t.adet<=0?["Tükendi","bad"]:t.adet<=AZ?["Az kaldı","warn"]:["Stokta","ok"];
const photo=t=>t.foto?`<img src="${esc(t.foto)}" alt="${esc(t.ad)} tohumu" loading="lazy" onerror="this.parentNode.textContent='${emo(t.kategori)}'">`:emo(t.kategori);
const fmtDate=s=>s?new Date(s).toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"}):"";
async function init(){
 try{const r=await fetch("seeds.json?v="+Date.now());D=await r.json()}catch(e){$("#grid").innerHTML='<p style="grid-column:1/-1">Veriler yüklenemedi. Siteyi bir web sunucusu (GitHub Pages, Vercel) üzerinden açın.</p>';return}
 const s=D.site||{};AZ=s.azEsik??10;
 $("#okul").textContent=s.okul||"";$("#baslik").textContent=s.baslik||"Tohum Bankası";document.title=s.baslik||"Tohum Bankası";$("#aciklama").textContent=s.aciklama||"";
 if(s.iletisim){$("#iletisim").hidden=false;$("#iletisimMetin").textContent=s.iletisim}
 sup();sections();
 const T=D.tohumlar,tot=T.reduce((a,t)=>a+(+t.adet||0),0),dates=T.map(t=>t.guncelleme).filter(Boolean).sort();
 $("#stats").innerHTML=`<div><b>${T.length}</b><span>çeşit</span></div><div><b>${tot}</b><span>toplam adet</span></div><div><b>${new Set(T.map(t=>t.kategori)).size}</b><span>kategori</span></div>`;
 if(dates.length)$("#foot").textContent="Son güncelleme: "+fmtDate(dates[dates.length-1]);
 chips();render()}
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";
function sup(){const L=D.destekciler||[];if(!L.length)return;$("#destek").hidden=false;
 $("#dgrid").innerHTML=L.map(d=>{const u=safeUrl(d.link),inner=`<div class="lg">${d.logo?`<img src="${esc(d.logo)}" alt="" loading="lazy" onerror="this.parentNode.textContent='🤝'">`:esc((d.ad||"?").trim().charAt(0).toLocaleUpperCase("tr"))}</div><div><b>${esc(d.ad)}</b><span class="tur">${esc(d.tur||"")}</span>${d.aciklama?`<p>${esc(d.aciklama)}</p>`:""}</div>`;
  return u?`<a class="dc" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${inner}</a>`:`<div class="dc">${inner}</div>`}).join("")}
function sec(id,h,body){const e=$("#"+id);e.hidden=false;e.innerHTML=`<h2>${h}</h2>`+body}
function sections(){const s=D.site||{},nv=[["tohumlar","Tohumlar"]];
 const N=[...(D.duyurular||[])].sort((a,b)=>(b.tarih||"").localeCompare(a.tarih||"")).slice(0,6);
 if(N.length){sec("duyuru","Duyurular ve etkinlikler 📢",`<div class="news">${N.map(n=>`<article class="nw"><span class="tur ${n.tur==="Etkinlik"?"ev":""}">${esc(n.tur||"Duyuru")}</span>${n.tarih?`<time>${fmtDate(n.tarih)}</time>`:""}<h3>${esc(n.baslik)}</h3><p>${esc(n.metin)}</p></article>`).join("")}</div>`);nv.push(["duyuru","Duyurular"])}
 if(s.hakkimizda){sec("hakkimizda","Hakkımızda 🌿",`<p class="abt">${esc(s.hakkimizda)}</p>`);nv.push(["hakkimizda","Hakkımızda"])}
 const E=D.ekip||[];if(E.length){sec("ekip","Ekibimiz 👩‍🏫",`<div class="team">${E.map(p=>`<div class="tm"><div class="av"><span>${esc((p.ad||"?").trim().charAt(0).toLocaleUpperCase("tr"))}</span>${p.foto?`<img src="${esc(p.foto)}" alt="${esc(p.ad)}" loading="lazy" onerror="this.remove()">`:""}</div><b>${esc(p.ad)}</b><span>${esc(p.gorev||"")}</span></div>`).join("")}</div>`);nv.push(["ekip","Ekip"])}
 const Gl=D.galeri||[];if(Gl.length){sec("galeri","Fotoğraf galerisi 📷",`<div class="gal">${Gl.map((g,i)=>`<button class="gi" data-i="${i}" aria-label="${esc(g.aciklama||"Fotoğraf")}"><img src="${esc(g.foto)}" alt="${esc(g.aciklama||"")}" loading="lazy"></button>`).join("")}</div>`);
  $("#galeri").querySelectorAll(".gi").forEach(b=>b.onclick=()=>{const g=Gl[b.dataset.i];$("#dc").innerHTML=`<div class="dh"><img src="${esc(g.foto)}" alt="${esc(g.aciklama||"")}" style="width:100%;display:block"><button class="x" aria-label="Kapat" id="cl">✕</button></div>${g.aciklama?`<div class="db"><p style="margin:0">${esc(g.aciklama)}</p></div>`:""}`;$("#cl").onclick=()=>$("#dlg").close();$("#dlg").showModal()});nv.push(["galeri","Galeri"])}
 const F=D.sss||[];if(F.length){sec("sss","Sık sorulan sorular ❓",`<div class="faq">${F.map(f=>`<details><summary>${esc(f.soru)}</summary><p>${esc(f.cevap)}</p></details>`).join("")}</div>`);nv.push(["sss","SSS"])}
 if((D.destekciler||[]).length)nv.push(["destek","Destekçiler"]);
 $("#nav").innerHTML=nv.map(([i,t])=>`<a href="#${i}">${t}</a>`).join("");$("#nav").hidden=nv.length<3;
 const so=s.sosyal||{},L=[["instagram","Instagram"],["facebook","Facebook"],["youtube","YouTube"]].filter(([k])=>safeUrl(so[k])).map(([k,n])=>`<a href="${esc(so[k])}" target="_blank" rel="noopener noreferrer">${n}</a>`);
 if(so.eposta&&/^[^\s@<>"]+@[^\s@<>"]+$/.test(so.eposta))L.push(`<a href="mailto:${esc(so.eposta)}">${esc(so.eposta)}</a>`);
 $("#social").innerHTML=L.join(" · ");if(s.logo){$("#logo").src=s.logo;$("#logo").hidden=false}}
function chips(){const cs=["Tümü",...new Set(D.tohumlar.map(t=>t.kategori).filter(Boolean))];
 $("#chips").innerHTML=cs.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${esc(c)}">${c==="Tümü"?"":emo(c)+" "}${esc(c)}</button>`).join("");
 $("#chips").querySelectorAll("button").forEach(b=>b.onclick=()=>{cat=b.dataset.c;chips();render()})}
function render(){const q=$("#q").value.trim().toLocaleLowerCase("tr");
 const L=D.tohumlar.filter(t=>(cat==="Tümü"||t.kategori===cat)&&(!q||[t.ad,t.bilimselAd,t.kategori,t.aciklama].join(" ").toLocaleLowerCase("tr").includes(q)));
 $("#empty").hidden=L.length>0;
 $("#grid").innerHTML=L.map(t=>{const [st,c]=status(t);return`<button class="card" data-id="${esc(t.id)}"><div class="ph">${photo(t)}</div><div class="cb"><h3>${esc(t.ad)}</h3>${t.bilimselAd?`<p class="sci">${esc(t.bilimselAd)}</p>`:""}<p class="d">${esc(t.aciklama)}</p><div class="row"><span class="badge ${c}">${st}</span><span class="qty">${esc(t.adet)} ${esc(t.birim||"")}</span></div></div></button>`}).join("");
 $("#grid").querySelectorAll(".card").forEach(b=>b.onclick=()=>open(b.dataset.id))}
function open(id){const t=D.tohumlar.find(x=>x.id===id);if(!t)return;const [st,c]=status(t);
 $("#dc").innerHTML=`<div class="dh"><div class="ph">${photo(t)}</div><button class="x" aria-label="Kapat" id="cl">✕</button></div><div class="db"><h2>${esc(t.ad)}</h2>${t.bilimselAd?`<p class="sci">${esc(t.bilimselAd)}</p>`:""}<p>${esc(t.aciklama)}</p>
 <dl><dt>Durum</dt><dd><span class="badge ${c}">${st}</span></dd><dt>Stok</dt><dd><b>${esc(t.adet)}</b> ${esc(t.birim||"")}</dd>${t.kategori?`<dt>Kategori</dt><dd>${emo(t.kategori)} ${esc(t.kategori)}</dd>`:""}${t.ekim?`<dt>Ekim zamanı</dt><dd>${esc(t.ekim)}</dd>`:""}${t.guncelleme?`<dt>Güncelleme</dt><dd>${fmtDate(t.guncelleme)}</dd>`:""}</dl></div>`;
 $("#cl").onclick=()=>$("#dlg").close();$("#dlg").showModal()}
$("#dlg").addEventListener("click",e=>{if(e.target===$("#dlg"))$("#dlg").close()});
$("#q").addEventListener("input",render);init();
</script></body></html>
